[package]
name = "victory-shader-dylib"
description = "The shader translator behind a C ABI, built as a DLL the running game can swap (VICTORY_LIVE_TRANSLATOR)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the DLL; rlib: the tests call the exports directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
victory-shader.workspace = true

[dev-dependencies]
blake3.workspace = true

[lints]
workspace = true
